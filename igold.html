<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    
    <!-- Redirecionamento instantâneo via HTML -->
    <meta http-equiv="refresh" content="0; url=https://www.igold.com.br">
    
    <script>
        // Redirecionamento instantâneo via JS (Garante que funcione mesmo se o meta falhar)
        window.location.replace("https://www.igold.com.br");
    </script>
</head>
<body>
    <p>Redirecionando para o sistema... Se não for redirecionado, <a href="https://www.igold.com.br">clique aqui</a>.</p>
</body>
</html>
